name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test release commit
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release request
        id: validate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases can only be created from the main branch.'
          }

          $pattern = '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'
          if ($env:RELEASE_TAG -cnotmatch $pattern) {
            throw 'Version must use stable SemVer format vMAJOR.MINOR.PATCH (for example v1.2.3).'
          }

          $version = "$($Matches.major).$($Matches.minor).$($Matches.patch)"
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Run Windows acceptance tests
        shell: pwsh
        run: dotnet test .\tests\FilePermissionReporter.Tests.csproj --configuration Release

  publish:
    name: Package and publish release
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Check tag and release availability
        id: preflight
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases can only be created from the main branch.'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "$($env:GITHUB_API_URL.TrimEnd('/'))/repos/$env:GITHUB_REPOSITORY"

          function Get-OptionalGitHubResource([string]$Uri) {
            try {
              return Invoke-RestMethod -Method Get -Uri $Uri -Headers $headers
            } catch {
              $statusCode = if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                [int]$_.Exception.Response.StatusCode
              } else {
                0
              }
              if ($statusCode -eq 404) { return $null }
              throw
            }
          }

          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Get-OptionalGitHubResource "$apiRoot/releases/tags/$tag"
          $tagReference = Get-OptionalGitHubResource "$apiRoot/git/ref/tags/$tag"
          $resumeDraft = $false

          if ($release -and -not $release.draft) {
            throw "Release $env:RELEASE_TAG already exists; published releases are never overwritten."
          }
          if ($release) {
            if (-not $tagReference -or $tagReference.object.type -ne 'commit' -or $tagReference.object.sha -ne $env:GITHUB_SHA) {
              throw "Draft release $env:RELEASE_TAG does not point to this workflow commit; refusing to modify it."
            }
            Write-Host "Resuming the existing draft release for commit $env:GITHUB_SHA."
            $resumeDraft = $true
          } elseif ($tagReference) {
            throw "Git tag $env:RELEASE_TAG already exists; release tags are never moved or reused."
          }
          "resume=$($resumeDraft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build the versioned portable package
        shell: pwsh
        run: .\publish-portable.ps1 -Version $env:RELEASE_VERSION

      - name: Create or resume the draft release
        shell: pwsh
        env:
          RESUME_DRAFT: ${{ steps.preflight.outputs.resume }}
        run: |
          if ($env:RESUME_DRAFT -ne 'true') {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "File Permission Reporter $env:RELEASE_TAG" `
              --generate-notes `
              --draft
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the draft release.' }
          }

      - name: Upload the portable package
        shell: pwsh
        run: |
          $assetName = "FilePermissionReporter-$env:RELEASE_TAG-win-x64.zip"
          $assetPath = Join-Path $PWD "artifacts/$assetName"
          if (-not (Test-Path -LiteralPath $assetPath)) { throw "Release asset not found: $assetPath" }

          gh release upload $env:RELEASE_TAG $assetPath --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload the portable package.' }

          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read back the draft release.' }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft -or $release.assets.name -notcontains $assetName) {
            throw 'The release asset was not attached to the draft release.'
          }

      - name: Publish the verified release
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }

          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read back the published release.' }
          $release = $releaseJson | ConvertFrom-Json
          $assetName = "FilePermissionReporter-$env:RELEASE_TAG-win-x64.zip"
          if ($release.isDraft -or $release.assets.name -notcontains $assetName) {
            throw 'Published release verification failed.'
          }

          @(
            "Published **$env:RELEASE_TAG** from commit ``$env:GITHUB_SHA``."
            "Asset: ``$assetName``"
            "Release: $($release.url)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
